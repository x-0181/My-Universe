<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05060d">
<title>Our Little Universe</title>
<style>
:root{
  --space:#05060d; --ink:#f4ece6; --dim:#b9aea6; --faint:#7d746f;
  --ember:#ff6a2b; --gold:#ffb347; --ice:#7fb2ff;
  --glass:rgba(14,12,20,.62); --glass-2:rgba(255,255,255,.06); --line:rgba(255,160,110,.18);
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Noto Naskh Arabic",serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Arabic","Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--space);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55}
#galaxy{position:fixed;inset:0;width:100%;height:100%;z-index:0;display:block}
.no-webgl body,.no-webgl{background:radial-gradient(ellipse at 50% 40%,#3a1305 0,#0a0612 55%,#05060d 100%)}
.veil{position:fixed;inset:0;z-index:1;pointer-events:none;background:rgba(5,6,13,0);transition:background .8s}
body:not([data-view="home"]) .veil{background:radial-gradient(ellipse at 50% 30%,rgba(5,6,13,.35),rgba(5,6,13,.78))}
body[data-view="home"] .veil{background:radial-gradient(ellipse at 50% 38%,rgba(5,6,13,0) 30%,rgba(5,6,13,.55))}

.top{position:fixed;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;gap:10px;
  padding:calc(env(safe-area-inset-top) + 12px) 16px 12px;background:linear-gradient(rgba(5,6,13,.75),rgba(5,6,13,0))}
.brand{display:flex;align-items:center;gap:9px;color:var(--ink);text-decoration:none;font-family:var(--serif);font-style:italic;font-size:1.02rem;margin-right:auto}
.dot{width:10px;height:10px;border-radius:50%;background:radial-gradient(circle,#000 38%,var(--ember) 40%,var(--gold) 62%,transparent 70%);box-shadow:0 0 12px var(--ember)}
.badge{font:11px var(--mono);color:var(--gold);border:1px solid var(--line);padding:2px 8px;border-radius:99px;background:var(--glass)}
.icon-btn{border:1px solid var(--line);background:var(--glass);color:var(--ink);width:38px;height:38px;border-radius:50%;font-size:18px;cursor:pointer;backdrop-filter:blur(8px)}

.wrap{position:relative;z-index:10;max-width:760px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 64px) 16px calc(env(safe-area-inset-bottom) + 110px)}

/* ---------- hero ---------- */
.hero{min-height:calc(100svh - 230px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8vh 0 4vh}
.hero h1{font-family:var(--serif);font-weight:400;font-size:clamp(2.5rem,11vw,5rem);line-height:1.02;margin:0;letter-spacing:.01em;
  text-shadow:0 0 30px rgba(255,106,43,.55),0 2px 24px rgba(0,0,0,.8)}
.hero h1 em{display:block;font-style:italic;color:var(--gold)}
.hero p{margin:16px 0 0;color:#e8d9cf;font-size:1.05rem;max-width:30ch;text-shadow:0 1px 14px rgba(0,0,0,.9)}
.hero .code{margin-top:22px;font:12px var(--mono);color:var(--ice);opacity:.85;text-shadow:0 1px 10px #000}
.hero .code b{color:var(--ember);font-weight:400}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{all:unset;box-sizing:border-box;cursor:pointer;display:block;padding:16px;border-radius:18px;background:var(--glass);border:1px solid var(--line);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:transform .2s,border-color .2s}
.tile:hover,.tile:focus-visible{transform:translateY(-2px);border-color:rgba(255,160,110,.5)}
.tile .ic{font-size:22px;color:var(--gold)}
.tile h3{margin:6px 0 2px;font-family:var(--serif);font-weight:400;font-size:1.25rem}
.tile small{color:var(--dim);display:block}
.tile .last{margin-top:8px;color:var(--faint);font-size:.82rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ---------- section pages ---------- */
.page-head{margin:6px 0 18px}
.page-head h2{margin:0;font-family:var(--serif);font-weight:400;font-size:2.1rem;text-shadow:0 0 24px rgba(255,106,43,.4)}
.page-head p{margin:2px 0 0;color:var(--dim)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:16px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-right:auto}
.chip{border:1px solid var(--line);background:var(--glass);color:var(--dim);padding:5px 12px;border-radius:99px;font:inherit;font-size:.85rem;cursor:pointer}
.chip.on{color:#1a0c05;background:linear-gradient(135deg,var(--gold),var(--ember));border-color:transparent}
.btn{font:inherit;border:1px solid var(--line);background:var(--glass-2);color:var(--ink);padding:9px 16px;border-radius:12px;cursor:pointer}
.btn.primary{background:linear-gradient(135deg,var(--gold),var(--ember));color:#1a0c05;border:none;font-weight:600}
.btn.danger{color:#ff8f8f;border-color:rgba(255,120,120,.35)}
.btn:active{transform:scale(.98)}

.list{display:flex;flex-direction:column;gap:12px}
.card{all:unset;box-sizing:border-box;display:block;width:100%;cursor:pointer;padding:16px 18px;border-radius:18px;background:var(--glass);border:1px solid var(--line);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:border-color .2s,transform .2s}
.card:hover,.card:focus-visible{border-color:rgba(255,160,110,.5);transform:translateY(-1px)}
.meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.78rem;color:var(--faint);font-family:var(--mono)}
.meta .tag{color:var(--gold);border:1px solid var(--line);padding:0 8px;border-radius:99px}
.card h3{margin:6px 0 4px;font-family:var(--serif);font-weight:400;font-size:1.25rem}
.preview{color:var(--dim);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap}
.letter-card{position:relative;padding-left:58px}
.letter-card .env{position:absolute;left:16px;top:16px;font-size:26px;filter:drop-shadow(0 0 8px rgba(255,106,43,.5))}
.song-card{display:flex;gap:14px;align-items:center}
.vinyl{flex:none;width:54px;height:54px;border-radius:50%;background:radial-gradient(circle,var(--ember) 0 9%,#111 10% 100%);
  box-shadow:inset 0 0 0 5px #1b1b22,inset 0 0 0 7px #0a0a0e,0 0 18px rgba(255,106,43,.25);animation:spin 9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{text-align:center;color:var(--dim);padding:44px 18px;border:1px dashed var(--line);border-radius:18px;background:var(--glass)}
.empty b{display:block;font-family:var(--serif);font-weight:400;font-size:1.3rem;color:var(--ink);margin-bottom:4px}
.fab{position:fixed;z-index:25;right:max(16px,calc(50% - 364px));bottom:calc(env(safe-area-inset-bottom) + 86px);width:54px;height:54px;border-radius:50%;border:none;cursor:pointer;
  font-size:28px;line-height:1;color:#1a0c05;background:linear-gradient(135deg,var(--gold),var(--ember));box-shadow:0 6px 28px rgba(255,106,43,.5)}
body[data-view="home"] .fab{display:none}

/* ---------- nav ---------- */
.nav{position:fixed;z-index:30;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 12px);display:flex;gap:2px;padding:6px;
  border-radius:22px;background:rgba(14,12,20,.78);border:1px solid var(--line);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);width:min(94vw,460px)}
.nav button{flex:1;border:none;background:none;color:var(--faint);font:inherit;font-size:.7rem;padding:7px 0 5px;border-radius:16px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px}
.nav button i{font-style:normal;font-size:18px}
.nav button.on{color:var(--gold);background:rgba(255,160,110,.12)}

/* ---------- modal / forms ---------- */
.modal-bg{position:fixed;inset:0;z-index:50;background:rgba(3,3,8,.72);display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px);animation:fade .2s}
@keyframes fade{from{opacity:0}}
.modal{position:relative;width:min(460px,100%);max-height:72svh;transition:width .25s,max-height .25s;overflow:auto;background:#0f0c16;border:1px solid var(--line);border-radius:24px 24px 0 0;padding:22px 20px calc(env(safe-area-inset-bottom) + 22px);animation:up .25s}
@keyframes up{from{transform:translateY(30px);opacity:0}}
@media(min-width:700px){.modal-bg{align-items:center}.modal{border-radius:24px}}
.modal h3{margin:0 0 12px;font-family:var(--serif);font-weight:400;font-size:1.6rem}
.modal .row{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
.modal .row .grow{margin-right:auto}
label.f{display:block;margin-top:12px;font-size:.8rem;color:var(--dim);font-family:var(--mono)}
.f input,.f textarea,.f select,.lock input{display:block;width:100%;margin-top:5px;font:inherit;color:var(--ink);background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;padding:11px 12px;outline:none}
.f textarea{resize:vertical;min-height:120px;line-height:1.6}
.f input:focus,.f textarea:focus,.f select:focus,.lock input:focus{border-color:var(--ember);box-shadow:0 0 0 3px rgba(255,106,43,.18)}
.f select option{background:#15101c}
.moods{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.moods button{font-size:22px;border:1px solid var(--line);background:none;border-radius:12px;padding:4px 8px;cursor:pointer}
.moods button.on{background:rgba(255,160,110,.22);border-color:var(--ember)}
.full{white-space:pre-wrap;word-wrap:break-word;font-family:var(--serif);font-size:1.12rem;line-height:1.75;margin-top:14px}
.hint{color:var(--faint);font-size:.82rem;margin-top:6px}

.chat{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.bub{max-width:82%;padding:9px 13px;border-radius:18px;background:rgba(255,255,255,.08);align-self:flex-start;border-bottom-left-radius:5px;white-space:pre-wrap}
.bub.r{align-self:flex-end;background:linear-gradient(135deg,rgba(255,179,71,.28),rgba(255,106,43,.28));border-bottom-left-radius:18px;border-bottom-right-radius:5px}
.bub small{display:block;font:10px var(--mono);color:var(--dim);margin-bottom:1px}

.toast{position:fixed;z-index:80;left:50%;bottom:104px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#1a1422;border:1px solid var(--line);padding:9px 16px;border-radius:99px;font-size:.88rem;transition:.3s}
.toast.on{opacity:1;transform:translate(-50%,0)}
.lock{position:fixed;inset:0;z-index:100;background:radial-gradient(ellipse at 50% 40%,#2a0d04,#05060d 70%);display:flex;align-items:center;justify-content:center;padding:20px}
.lock[hidden]{display:none}
.lock-box{width:min(340px,100%);text-align:center;display:flex;flex-direction:column;gap:12px}
.lock-title{font-family:var(--serif);font-style:italic;font-size:2rem;color:var(--gold)}
.lock-box p{margin:0;color:var(--dim)}
.lock-box input{text-align:center;letter-spacing:.3em}
.lock-err{color:#ff8f8f;min-height:1.2em;font-size:.85rem}
[hidden]{display:none!important}

/* compact writing box by default; the ⤢ button enlarges it */
.modal h3{padding-right:44px;font-size:1.35rem}
.expand{position:absolute;top:14px;right:14px;width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:var(--glass-2);color:var(--ink);font-size:17px;cursor:pointer}
.modal .full{font-size:1rem;line-height:1.65}
.f textarea{min-height:76px}
.modal.big{width:min(900px,100%);max-height:96svh}
.modal.big .f textarea{min-height:46svh}
.modal.big .full{font-size:1.15rem}

/* write button inside the nav bar */
.nav button{flex:1 1 0;min-width:0;padding:7px 2px 5px}
.nav button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav button.write{color:#1a0c05;background:linear-gradient(135deg,var(--gold),var(--ember));font-weight:600;flex:1 1 0}
.nav button.write i{font-size:18px}
@media(max-width:380px){.nav button{font-size:.62rem}.nav button i{font-size:16px}}
.fab{display:none!important}
/* explore mode: fade the UI, let the galaxy be moved and zoomed */
body.explore .wrap,body.explore .nav,body.explore .top{opacity:0;pointer-events:none;transition:opacity .3s}
body.explore .veil{background:none!important}
.xbar{position:fixed;z-index:60;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 16px);display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none}
.xhint{font:12px var(--mono);color:var(--dim);background:var(--glass);padding:4px 12px;border-radius:99px;border:1px solid var(--line)}
.xbtns{display:flex;gap:8px;pointer-events:auto}
.xbtns button{min-width:48px;height:48px;border-radius:24px;border:1px solid var(--line);background:rgba(14,12,20,.78);color:var(--ink);font-size:22px;cursor:pointer;padding:0 16px;backdrop-filter:blur(10px)}
.xbtns .done{background:linear-gradient(135deg,var(--gold),var(--ember));color:#1a0c05;font-size:15px;font-weight:600;border:none}
.chooser{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}

/* clean home: no title, no boxes — the galaxy itself is touchable */
body.free .wrap{pointer-events:none}
.freehint{position:fixed;z-index:15;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 100px);text-align:center;font:11px var(--mono);color:var(--dim);opacity:0;pointer-events:none;transition:opacity .4s}
body.free .freehint{opacity:.55}
body.explore .freehint{opacity:0}

.shoot{position:fixed;z-index:2;width:var(--len,120px);height:2px;pointer-events:none;border-radius:2px;transform:rotate(32deg);transform-origin:left center;
  background:linear-gradient(90deg,rgba(255,255,255,0),rgba(255,235,210,.95));filter:drop-shadow(0 0 6px rgba(255,190,130,.9));opacity:0;animation:shoot 1.2s ease-out forwards}
@keyframes shoot{0%{opacity:0;translate:-30px -20px}15%{opacity:1}100%{opacity:0;translate:200px 125px}}

/* same icon box for every nav button so all labels sit on one line */
.nav button i{display:block;height:22px;line-height:22px;overflow:visible}
.nav button.write i{font-size:16px}
.nav button span{line-height:1.2}

/* Write looks like the other tabs; only its pencil is accent-coloured */
.nav button.write{background:none;color:var(--faint);font-weight:400}
.nav button.write i{display:flex;align-items:center;justify-content:center;font-size:18px}
.nav button.write svg{fill:none;stroke:var(--gold);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button.write:active{background:rgba(255,160,110,.12)}

</style>
</head>
<body data-view="home">
<canvas id="galaxy" aria-hidden="true"></canvas>
<div class="veil" aria-hidden="true"></div>

<header class="top">
  <a class="brand" href="#home"><span class="dot"></span><span>Our Little Universe</span></a>
  <span id="syncBadge" class="badge" hidden></span>
  <button id="btnClean" class="icon-btn" aria-label="Show or hide the title and boxes" title="Show / hide title and boxes">◐</button>
  <button id="btnExplore" class="icon-btn" aria-label="Explore the galaxy" title="Explore the galaxy">✥</button>
  <button id="btnSettings" class="icon-btn" aria-label="Settings">⚙</button>
</header>

<main id="view" class="wrap"></main>

<nav class="nav" id="nav">
  <button data-go="home"><i>✦</i><span>Home</span></button>
  <button data-go="letters"><i>✉</i><span>Letters</span></button>
  <button data-go="diary"><i>☾</i><span>Diary</span></button>
  <button data-write class="write" aria-label="Write"><i><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 20l1-4L16.5 4.5a2 2 0 0 1 3 0l0 0a2 2 0 0 1 0 3L8 19l-4 1z"/><path d="M14 7l3 3"/></svg></i><span>Write</span></button>
  <button data-go="moments"><i>❖</i><span>Moments</span></button>
  <button data-go="songs"><i>♪</i><span>Songs</span></button>
</nav>

<div id="freeHint" class="freehint">drag: rotate · pinch: zoom · 2 fingers: move</div>
<div id="exploreBar" class="xbar" hidden>
  <div class="xhint">drag: rotate · pinch: zoom · 2 fingers: move</div>
  <div class="xbtns">
    <button data-x="out" aria-label="Zoom out">−</button>
    <button data-x="in" aria-label="Zoom in">+</button>
    <button data-x="reset" aria-label="Reset view">⟲</button>
    <button data-x="done" class="done">Done</button>
  </div>
</div>
<div id="modalRoot"></div>
<div id="toast" class="toast" role="status"></div>

<div id="lock" class="lock" hidden>
  <form id="lockForm" class="lock-box">
    <div class="lock-title">Our Little Universe</div>
    <p>This world is locked.</p>
    <input id="lockInput" type="password" inputmode="numeric" autocomplete="off" placeholder="passcode">
    <button class="btn primary" type="submit">Enter</button>
    <div id="lockErr" class="lock-err"></div>
  </form>
</div>

<script>
/* Our Little Universe — spiral galaxy with a black hole (raw WebGL, no libraries).
   Inspired by the "JavaScript Animation" galaxy: particles on spiral branches,
   orange/red core fading to blue edges, camera slowly dives toward the hole and back. */
(function () {
  'use strict';
  var canvas = document.getElementById('galaxy');
  if (!canvas) return;
  var gl = canvas.getContext('webgl', { antialias: false, alpha: false, powerPreference: 'high-performance' }) ||
           canvas.getContext('experimental-webgl');
  if (!gl) { document.body.classList.add('no-webgl'); return; }

  var mobile = /Android|iPhone|iPad|Mobi/i.test(navigator.userAgent) || Math.min(innerWidth, innerHeight) < 700;
  var N = mobile ? 70000 : 150000;
  var P = { radius: 4.6, branches: 3, spin: 1.15, randomness: 0.5, power: 2.6, hole: 0.34 };
  var INSIDE = [1.0, 0.36, 0.06], OUTSIDE = [0.22, 0.48, 1.0];

  /* ---------- particles ---------- */
  var STRIDE = 7, data = new Float32Array(N * STRIDE);
  function rnd() { return Math.random(); }
  function signedPow() { return Math.pow(rnd(), P.power) * (rnd() < 0.5 ? 1 : -1); }
  for (var i = 0; i < N; i++) {
    var o = i * STRIDE, x, y, z, r, mix;
    if (i < N * 0.06) {                         // faint far stars (sphere shell)
      var u = rnd() * 2 - 1, t = rnd() * Math.PI * 2, s = Math.sqrt(1 - u * u), R = 7 + rnd() * 9;
      x = s * Math.cos(t) * R; y = u * R; z = s * Math.sin(t) * R; r = 9; mix = 1;
      data[o + 6] = 0.5 + rnd() * 0.9;
      data[o + 3] = 0.55; data[o + 4] = 0.7; data[o + 5] = 1.0;
    } else {
      r = P.hole + Math.pow(rnd(), 1.7) * (P.radius - P.hole);
      var a = (i % P.branches) / P.branches * Math.PI * 2 + r * P.spin;
      x = Math.cos(a) * r + signedPow() * P.randomness * r;
      z = Math.sin(a) * r + signedPow() * P.randomness * r;
      y = signedPow() * P.randomness * r * 0.45;
      mix = Math.min(1, r / P.radius);
      var j = 0.75 + rnd() * 0.5;
      data[o + 3] = (INSIDE[0] + (OUTSIDE[0] - INSIDE[0]) * mix) * j;
      data[o + 4] = (INSIDE[1] + (OUTSIDE[1] - INSIDE[1]) * mix) * j;
      data[o + 5] = (INSIDE[2] + (OUTSIDE[2] - INSIDE[2]) * mix) * j;
      data[o + 6] = 0.5 + rnd() * 1.5;
    }
    data[o] = x; data[o + 1] = y; data[o + 2] = z;
  }

  function shader(type, src) {
    var s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s));
    return s;
  }
  function program(vs, fs) {
    var p = gl.createProgram();
    gl.attachShader(p, shader(gl.VERTEX_SHADER, vs));
    gl.attachShader(p, shader(gl.FRAGMENT_SHADER, fs));
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) console.error(gl.getProgramInfoLog(p));
    return p;
  }

  var pProg = program(
    'attribute vec3 aPos;attribute vec3 aColor;attribute float aSize;' +
    'uniform mat4 uMVP;uniform float uTime,uScale,uDim;varying vec3 vColor;varying float vA;' +
    'void main(){' +
    ' float r=length(aPos.xz);' +
    ' float w=uTime*(0.04+0.2/(0.6+r));float c=cos(w),s=sin(w);' +
    ' vec3 p=vec3(aPos.x*c-aPos.z*s,aPos.y,aPos.x*s+aPos.z*c);' +
    ' vec4 q=uMVP*vec4(p,1.0);gl_Position=q;' +
    ' float sz=aSize*uScale/max(q.w,0.08);' +
    ' gl_PointSize=clamp(sz,1.0,56.0);' +
    ' float glow=1.0+2.2*exp(-r*1.6);' +
    ' vColor=aColor*glow*0.62*uDim;' +
    ' vA=clamp(sz/3.0,0.35,1.0);' +
    '}',
    'precision mediump float;varying vec3 vColor;varying float vA;' +
    'void main(){vec2 d=gl_PointCoord-0.5;float k=smoothstep(0.5,0.0,length(d));' +
    ' gl_FragColor=vec4(vColor*k*vA,1.0);}'
  );

  var hProg = program(
    'attribute vec2 aP;void main(){gl_Position=vec4(aP,0.0,1.0);}',
    'precision mediump float;uniform vec2 uRes,uR;' +
    'void main(){vec2 p=(gl_FragCoord.xy-uRes*0.5)/uR;float d=length(p);' +
    ' float ring=exp(-pow((d-1.02)*3.2,2.0));' +
    ' vec3 col=vec3(1.0,0.45,0.12)*ring*0.55;' +
    ' float core=1.0-smoothstep(0.86,1.0,d);' +

  /* ---------- twinkling star field (far shell around everything) ---------- */
  var NS = mobile ? 2200 : 4200, sd = new Float32Array(NS * 7), pal = [[1, 1, 1], [0.7, 0.8, 1], [1, 0.9, 0.7], [1, 0.75, 0.8], [0.75, 1, 1]];
  for (var s = 0; s < NS; s++) {
    var uu = rnd() * 2 - 1, tt = rnd() * Math.PI * 2, ss = Math.sqrt(1 - uu * uu), RR = 14 + rnd() * 18, cc = pal[(rnd() * pal.length) | 0], b = 0.35 + rnd() * 0.65, q = s * 7;
    sd[q] = ss * Math.cos(tt) * RR; sd[q + 1] = uu * RR; sd[q + 2] = ss * Math.sin(tt) * RR;

    'attribute vec3 aPos;attribute vec3 aCol;attribute float aSeed;uniform mat4 uMVP;uniform float uTime,uPx;varying vec3 vC;' +
    'void main(){gl_Position=uMVP*vec4(aPos,1.0);' +
    ' float tw=0.55+0.45*sin(uTime*(0.7+aSeed*2.6)+aSeed*60.0);' +
    ' float big=step(0.965,aSeed);' +
    ' gl_PointSize=(1.9+aSeed*2.2+big*4.5)*uPx*(0.7+0.3*tw);' +
    ' vC=aCol*(0.7+1.1*tw)*(1.0+big*0.8);}',
    'precision mediump float;varying vec3 vC;void main(){vec2 d=gl_PointCoord-0.5;float r=length(d);' +
    ' float core=smoothstep(0.5,0.0,r);float cross=smoothstep(0.06,0.0,min(abs(d.x),abs(d.y)))*smoothstep(0.5,0.1,r)*0.5;' +
    ' gl_FragColor=vec4(vC*(core*core+cross),1.0);}'
  );

    gl.blendFunc(gl.ONE, gl.ONE);

    gl.bindBuffer(gl.ARRAY_BUFFER, pBuf);

    gl.enableVertexAttribArray(loc.pos); gl.vertexAttribPointer(loc.pos, 3, gl.FLOAT, false, STRIDE * B, 0);

    gl.uniform1f(loc.scale, (H / (2 * Math.tan(FOV / 2))) * 0.0085 * 2.2);

    var focal = H / (2 * Math.tan(FOV / 2));
    var rx = P.hole * 0.95 * focal / cam.dist;
    var ry = rx * Math.max(0.12, Math.abs(Math.sin(pitch)));

  /* ---------- shooting stars (DOM, cheap) ---------- */
  (function () {
    if (reduce) return;
    function shoot() {
      if (!document.hidden) {
        var d = document.createElement('div'); d.className = 'shoot';
        d.style.left = (10 + Math.random() * 70) + 'vw'; d.style.top = (4 + Math.random() * 38) + 'vh';

<script>
/* Our Little Universe — app logic.
   Data lives in this browser (localStorage). If you run server.py, it is also saved to data.json
   so two phones on the same Wi-Fi share one universe. */
(function () {
  'use strict';
  var KEY = 'our-little-universe-v1';
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var uid = function () { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); };
  var today = function () { var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
  var fmt = function (d) { if (!d) return ''; var x = new Date(d + (d.length === 10 ? 'T12:00:00' : '')); return isNaN(x) ? d : x.toLocaleDateString('en-US', { day: 'numeric', month: 'short', year: 'numeric' }); };

    var b = blank(); s = s || {};
    b.settings = Object.assign(b.settings, s.settings || {});
    ['letters', 'diary', 'moments', 'songs'].forEach(function (k) { b[k] = Array.isArray(s[k]) ? s[k] : []; });
    ['letters', 'diary', 'moments', 'songs'].forEach(function (k) { b[k].forEach(function (it) { if (!it.id) it.id = uid(); }); });
    b.updatedAt = s.updatedAt || 0; return b;
  }
  var state;
  try { state = normalize(JSON.parse(localStorage.getItem(KEY))); } catch (e) { state = blank(); }
  if (!state.updatedAt) {
    state.letters.push({ id: uid(), from: 'me', title: 'Welcome to our little universe', date: today(), created: Date.now(),
      body: 'This is a small world just for us.\n\nWrite letters here, keep the days you never want to forget, save the conversations that made you laugh, and collect the songs that remind you of moments.\n\nTap the + button to add your first memory. ✦' });
  }

  }

  }

    fetch('api/data', { cache: 'no-store' }).then(function (r) { if (!r.ok) throw 0; return r.json(); }).then(function (j) {
      serverMode = true; badge('● synced');
      if (j && j.v && (j.updatedAt || 0) > state.updatedAt) { state = normalize(j); localStorage.setItem(KEY, JSON.stringify(state)); render(); checkLock(); }

          '<h3 dir="auto">' + esc(it.title || 'Untitled') + '</h3><div class="preview" dir="auto">' + esc(it.body) + '</div></button>';
      },
