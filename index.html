<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Our Little Universe</title>
  <style>
    :root {
      --bg: #0c0d12;
      --card: #161822;
      --text: #f3f4f8;
      --muted: #9aa0b4;
      --accent: #f59e0b;
      --border: #272b3d;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-bottom: 72px;
    }
    header {
      padding: 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .badge {
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(245, 158, 11, 0.15);
      color: var(--accent);
    }
    main { max-width: 760px; margin: 0 auto; padding: 16px; }
    .panel {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 14px;
    }
    input, textarea, select, button {
      width: 100%;
      margin-top: 8px;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #10121a;
      color: var(--text);
      font-size: 14px;
    }
    button {
      background: var(--accent);
      color: #111;
      font-weight: 700;
      border: none;
      cursor: pointer;
    }
    .item {
      border-top: 1px solid var(--border);
      padding-top: 10px;
      margin-top: 10px;
    }
    .meta { font-size: 12px; color: var(--muted); }
    nav {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: #11131b;
      border-top: 1px solid var(--border);
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 4px;
      padding: 6px;
    }
    nav button {
      margin: 0;
      padding: 8px 4px;
      font-size: 12px;
      background: transparent;
      color: var(--muted);
    }
    nav button.active {
      background: rgba(245, 158, 11, 0.18);
      color: var(--accent);
    }
  </style>
</head>
<body>
  <header>
    <div>
      <strong>Our Little Universe</strong>
      <div class="meta" id="statusText">جارٍ التحقق من الاتصال...</div>
    </div>
    <span class="badge" id="sectionBadge">Home</span>
  </header>

  <main>
    <section id="homeView" class="panel">
      <h2>أهلاً بك في مساحة المشروع</h2>
      <p class="meta">اختر قسماً من الأسفل لإضافة أو عرض العناصر.</p>
    </section>

    <section id="formPanel" class="panel">
      <h3>إضافة عنصر جديد</h3>
      <select id="categoryInput">
        <option value="letters">Letters (رسائل)</option>
        <option value="diary">Diary (يوميات)</option>
        <option value="moments">Moments (لحظات)</option>
        <option value="songs">Songs (أغاني)</option>
      </select>
      <input id="titleInput" type="text" placeholder="العنوان" />
      <textarea id="bodyInput" rows="4" placeholder="اكتب المحتوى هنا..."></textarea>
      <button id="saveBtn" type="button">حفظ</button>
    </section>

    <section id="listPanel" class="panel">
      <h3>العناصر المحفوظة</h3>
      <div id="itemsContainer"></div>
    </section>
  </main>

  <nav>
    <button type="button" data-tab="home" class="active">Home</button>
    <button type="button" data-tab="letters">Letters</button>
    <button type="button" data-tab="diary">Diary</button>
    <button type="button" data-tab="moments">Moments</button>
    <button type="button" data-tab="songs">Songs</button>
  </nav>

  <script type="module">
    import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

    const SUPABASE_URL = "https://biimayxczduxvagdxllz.supabase.co";
    const SUPABASE_KEY = "sb_publishable_gailki0S04-BHT-DGGHFPA_nwmR7WM7";
    const TABLE_NAME = "letters";

    const supabase = createClient(SUPABASE_URL, SUPABASE_KEY);

    const statusText = document.getElementById("statusText");
    const sectionBadge = document.getElementById("sectionBadge");
    const homeView = document.getElementById("homeView");
    const categoryInput = document.getElementById("categoryInput");
    const titleInput = document.getElementById("titleInput");
    const bodyInput = document.getElementById("bodyInput");
    const saveBtn = document.getElementById("saveBtn");
    const itemsContainer = document.getElementById("itemsContainer");
    const navButtons = [...document.querySelectorAll("nav button")];

    let currentTab = "home";
    let localStore = JSON.parse(localStorage.getItem("olu_fallback_items") || "[]");

    function renderItems(rows) {
      const filtered = currentTab === "home"
        ? rows
        : rows.filter((r) => (r.category || "letters") === currentTab);

      if (!filtered.length) {
        itemsContainer.innerHTML = `<div class="meta">لا توجد عناصر في هذا القسم حالياً.</div>`;
        return;
      }

      itemsContainer.innerHTML = filtered.map((item) => `
        <div class="item">
          <strong>${escapeHtml(item.title || "بدون عنوان")}</strong>
          <div class="meta">${escapeHtml(item.category || "letters")} • ${escapeHtml(item.created_at || "")}</div>
          <p>${escapeHtml(item.body || item.content || "")}</p>
        </div>
      `).join("");
    }

    function escapeHtml(str) {
      return String(str)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;");
    }

    async function loadData() {
      const { data, error } = await supabase
        .from(TABLE_NAME)
        .select("*")
        .order("id", { ascending: false });

      if (error) {
        statusText.textContent = "وضع محلي مؤقت (تحقق من صلاحيات جدول Supabase)";
        renderItems(localStore);
        return;
      }

      statusText.textContent = `متصل بـ Supabase (${TABLE_NAME})`;
      localStore = data || [];
      renderItems(localStore);
    }

    saveBtn.addEventListener("click", async () => {
      const title = titleInput.value.trim();
      const body = bodyInput.value.trim();
      const category = categoryInput.value;

      if (!title && !body) return;

      const payload = { title, body, category };
      const { error } = await supabase.from(TABLE_NAME).insert([payload]);

      if (error) {
        localStore.unshift({ ...payload, id: Date.now(), created_at: "محلي" });
        localStorage.setItem("olu_fallback_items", JSON.stringify(localStore));
        statusText.textContent = "تم الحفظ محلياً (تعذر الحفظ المباشر في Supabase)";
      } else {
        statusText.textContent = "تم الحفظ في Supabase";
      }

      titleInput.value = "";
      bodyInput.value = "";
      await loadData();
    });

    navButtons.forEach((btn) => {
      btn.addEventListener("click", () => {
        navButtons.forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        currentTab = btn.dataset.tab;
        sectionBadge.textContent = btn.textContent;
        homeView.style.display = currentTab === "home" ? "block" : "none";
        if (currentTab !== "home") {
          categoryInput.value = currentTab;
        }
        renderItems(localStore);
      });
    });

    loadData();
  </script>
</body>
</html>
